version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: signature
      DB_USERNAME: signature
      DB_PASSWORD: secret
    command: sleep infinity

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signature
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: signature
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signature"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
