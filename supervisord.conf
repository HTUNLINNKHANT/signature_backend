[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/php-fpm.err.log
stdout_logfile=/var/log/supervisor/php-fpm.out.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

[program:laravel-migrate]
command=php /var/www/html/artisan migrate --force
autostart=true
autorestart=false
startsecs=0
stderr_logfile=/var/log/supervisor/laravel-migrate.err.log
stdout_logfile=/var/log/supervisor/laravel-migrate.out.log

[program:laravel-seed]
command=php /var/www/html/artisan db:seed --force --class=DatabaseSeeder
autostart=true
autorestart=false
startsecs=0
priority=999
stderr_logfile=/var/log/supervisor/laravel-seed.err.log
stdout_logfile=/var/log/supervisor/laravel-seed.out.log
