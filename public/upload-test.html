<!DOCTYPE html>
<html>
<head>
    <title>Upload Test - 7MB File</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; }
        .result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        input[type="file"] { margin: 10px 0; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload Test - 7MB File</h1>
        <p>Test your large file upload capability directly.</p>
        
        <form id="uploadForm" enctype="multipart/form-data">
            <div>
                <label for="image">Select your 7MB image:</label><br>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>
            <div>
                <button type="submit">Test Upload</button>
            </div>
        </form>
        
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            const fileInput = document.getElementById('image');
            const file = fileInput.files[0];
            
            if (!file) {
                resultDiv.innerHTML = '<div class="error">Please select a file</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div>Uploading... Please wait</div>';
            
            const formData = new FormData();
            formData.append('image', file);
            
            try {
                const response = await fetch('/test-upload.php', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Upload Successful!</h3>
                            <p><strong>File:</strong> ${result.file_info.name}</p>
                            <p><strong>Size:</strong> ${(result.file_info.size / 1024 / 1024).toFixed(2)} MB</p>
                            <p><strong>Type:</strong> ${result.file_info.type}</p>
                            <p>Your server can handle large file uploads!</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Upload Failed</h3>
                            <p><strong>Error:</strong> ${result.message}</p>
                            <p><strong>File Size:</strong> ${file.size ? (file.size / 1024 / 1024).toFixed(2) + ' MB' : 'Unknown'}</p>
                            <h4>Server Configuration:</h4>
                            <ul>
                                <li>upload_max_filesize: ${result.config.upload_max_filesize}</li>
                                <li>post_max_size: ${result.config.post_max_size}</li>
                                <li>memory_limit: ${result.config.memory_limit}</li>
                            </ul>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Network Error</h3>
                        <p>Failed to connect to server: ${error.message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
