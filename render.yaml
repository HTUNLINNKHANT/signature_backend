services:
  - type: web
    name: signature-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Signature E-commerce
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: base64:ZN0KkKqwDmks315oQpF5mZPIzCIQrjf80gRgh+RFb5M=
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: false
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: signature-database
          property: host
      - key: DB_PORT
        fromDatabase:
          name: signature-database
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: signature-database
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: signature-database
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: signature-database
          property: password
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_NAME
        value: Signature Store
      - key: APP_URL
        fromService:
          type: web
          name: signature-backend
          property: host
      - key: SANCTUM_STATEFUL_DOMAINS
        value: localhost,127.0.0.1,signature-backend-8cfs.onrender.com,signature-frontend-eta.vercel.app
      - key: FRONTEND_URL
        value: https://signature-frontend-eta.vercel.app
      - key: FILESYSTEM_DISK
        value: local
      - key: BROADCAST_CONNECTION
        value: log
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en

databases:
  - name: signature-database
    databaseName: signature_ecommerce
    user: signature_user
    plan: free
    region: oregon
